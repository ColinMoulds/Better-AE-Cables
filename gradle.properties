# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# Must match a version from https://projects.neoforged.net/neoforged/neoforge
neo_version=26.1.2.87

## AE2 dependency (recon Step 1 finding — see /reference/AE2 for the matching source checkout)
# Modrinth project slug "ae2", published version 26.1.10-beta targets neoforge/26.1.2 (confirmed via Modrinth API).
ae2_version=26.1.10-beta
# AE2 hard-requires GuideME (its in-game guidebook mod) at runtime; slug "guideme".
guideme_version=26.1.12-beta

## Mod Properties
mod_id=aeoc
mod_name=Better AE Cables
mod_license=GPL-3.0-only
mod_version=0.1.0-SNAPSHOT
mod_group_id=dev.excal1bur.aeoc
